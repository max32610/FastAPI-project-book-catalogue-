services:
    db:
        image: postgres:16
        environment:
            POSTGRES_DB: app_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
    web:
        build: .
        ports:
        - "8000:8000"
        depends_on:
        - db
volumes:
    postgres_data: